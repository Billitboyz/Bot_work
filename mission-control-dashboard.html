<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mission Control Dashboard</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2e;
      --panel-2: #16223b;
      --text: #eaf1ff;
      --muted: #9fb0d8;
      --accent: #65d6ff;
      --ok: #36d399;
      --warn: #fbbf24;
      --busy: #60a5fa;
      --danger: #fb7185;
      --border: #223354;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 10% -20%, #182849 0%, var(--bg) 55%);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 14px;
    }

    .topbar {
      background: linear-gradient(180deg, #152241, #121d35);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title { font-size: 1.1rem; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: .88rem; }

    .status-pill {
      font-size: .8rem;
      background: #10263b;
      border: 1px solid #1c4263;
      color: var(--accent);
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: 1.05fr 1.5fr;
    }

    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: .95rem;
      letter-spacing: .02em;
      color: #dce8ff;
    }

    .agents {
      display: grid;
      gap: 10px;
    }

    .agent {
      border: 1px solid #243a62;
      background: #0f1930;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .agent .meta { display: grid; gap: 3px; }
    .agent .name { font-size: .9rem; font-weight: 600; }
    .agent .task { font-size: .8rem; color: var(--muted); }

    .badge {
      font-size: .74rem;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
    }
    .idle { background: #103325; color: var(--ok); border-color: #1f624a; }
    .working { background: #102740; color: var(--busy); border-color: #2b4f82; }
    .blocked { background: #3b1f1f; color: var(--danger); border-color: #6a2f2f; }

    .queue-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .metric {
      background: #0e1830;
      border: 1px solid #243a62;
      border-radius: 10px;
      padding: 10px;
    }
    .metric .label { font-size: .75rem; color: var(--muted); }
    .metric .value { font-size: 1.25rem; font-weight: 700; margin-top: 2px; }

    .current-task {
      border: 1px solid #243a62;
      border-radius: 10px;
      background: #0f1930;
      padding: 12px;
      margin-bottom: 12px;
    }
    .current-task .task-title { font-weight: 700; margin-bottom: 5px; }
    .current-task .task-meta { font-size: .82rem; color: var(--muted); }
    .progress {
      margin-top: 9px;
      height: 8px;
      background: #0c1428;
      border: 1px solid #243a62;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress > div {
      width: 48%;
      height: 100%;
      background: linear-gradient(90deg, #39c4ff, #4f8dff);
    }

    .feed {
      max-height: 380px;
      overflow: auto;
      display: grid;
      gap: 8px;
    }

    .event {
      border: 1px solid #243a62;
      background: #0f1930;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: .84rem;
      display: grid;
      gap: 3px;
    }
    .event .time { color: var(--muted); font-size: .74rem; }
    .event.ok { border-color: #285848; }
    .event.warn { border-color: #6d5a2e; }
    .event.info { border-color: #2c4f82; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .queue-summary { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="topbar">
      <div>
        <div class="title">Mission Control</div>
        <div class="subtitle">Agent orchestration • task queue • realtime status feed</div>
      </div>
      <div class="status-pill" id="lastUpdated">Last update: --</div>
    </header>

    <section class="grid">
      <article class="card">
        <h2>Agent List</h2>
        <div class="agents" id="agentList"></div>
      </article>

      <article class="card">
        <h2>Current Task + Queue Summary</h2>

        <div class="queue-summary" id="queueSummary"></div>

        <div class="current-task" id="currentTask"></div>

        <h2 style="margin-top: 12px;">Status Feed</h2>
        <div class="feed" id="statusFeed"></div>
      </article>
    </section>
  </main>

  <script>
    const state = {
      agents: [
        { id: 'agent-main', name: 'Main Agent', status: 'working', task: 'Mission Control dashboard (frontend)' },
        { id: 'agent-coder-1', name: 'Coder Subagent #1', status: 'working', task: 'Build agent list and task panels' },
        { id: 'agent-coder-2', name: 'Coder Subagent #2', status: 'idle', task: 'Awaiting assignment' },
        { id: 'agent-ops', name: 'Ops Watcher', status: 'blocked', task: 'Waiting for data source token' }
      ],
      queue: {
        total: 12,
        inProgress: 5,
        queued: 6,
        blocked: 1
      },
      currentTask: {
        title: 'Frontend shell: agents, queue, current task, status feed',
        owner: 'Main Agent',
        eta: '15m',
        progress: 48,
        notes: 'Chunk 1 complete; wiring simulated data renderer.'
      },
      events: [
        { level: 'ok', time: '17:31 UTC', text: 'Task accepted: Mission Control dashboard build started.' },
        { level: 'info', time: '17:33 UTC', text: 'Chunk 1: layout grid scaffolded.' },
        { level: 'info', time: '17:34 UTC', text: 'Agent list component rendered with status badges.' },
        { level: 'ok', time: '17:35 UTC', text: 'Queue summary cards wired.' },
        { level: 'warn', time: '17:35 UTC', text: 'Ops Watcher blocked: missing external token.' }
      ]
    };

    function renderAgents() {
      const root = document.getElementById('agentList');
      root.innerHTML = state.agents.map(a => `
        <div class="agent">
          <div class="meta">
            <div class="name">${a.name}</div>
            <div class="task">${a.task}</div>
          </div>
          <span class="badge ${a.status}">${a.status}</span>
        </div>
      `).join('');
    }

    function renderQueue() {
      const q = state.queue;
      const root = document.getElementById('queueSummary');
      root.innerHTML = `
        <div class="metric"><div class="label">Total</div><div class="value">${q.total}</div></div>
        <div class="metric"><div class="label">In Progress</div><div class="value">${q.inProgress}</div></div>
        <div class="metric"><div class="label">Queued</div><div class="value">${q.queued}</div></div>
        <div class="metric"><div class="label">Blocked</div><div class="value">${q.blocked}</div></div>
      `;
    }

    function renderCurrentTask() {
      const t = state.currentTask;
      const root = document.getElementById('currentTask');
      root.innerHTML = `
        <div class="task-title">${t.title}</div>
        <div class="task-meta">Owner: ${t.owner} • ETA: ${t.eta}</div>
        <div class="task-meta" style="margin-top:4px">${t.notes}</div>
        <div class="progress"><div style="width:${t.progress}%"></div></div>
      `;
    }

    function renderFeed() {
      const root = document.getElementById('statusFeed');
      root.innerHTML = state.events.map(e => `
        <div class="event ${e.level}">
          <div>${e.text}</div>
          <div class="time">${e.time}</div>
        </div>
      `).join('');
    }

    function stampUpdateTime() {
      const now = new Date();
      const utc = now.toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
      document.getElementById('lastUpdated').textContent = `Last update: ${utc}`;
    }

    function init() {
      renderAgents();
      renderQueue();
      renderCurrentTask();
      renderFeed();
      stampUpdateTime();
      setInterval(stampUpdateTime, 30000);
    }

    init();
  </script>
</body>
</html>
