<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mission Control Dashboard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <header class="topbar">
      <div>
        <div class="title">Mission Control</div>
        <div class="subtitle">Agent orchestration • task queue • realtime status feed</div>
      </div>
      <div>
        <div class="status-pill" id="lastUpdated">Last update: --</div>
        <div id="dataSource" class="subtitle" style="margin-top: 6px; text-align: right;">Source: --</div>
      </div>
    </header>

    <section class="grid">
      <article class="card">
        <h2>Agent List</h2>
        <div class="agents" id="agentList"></div>
      </article>

      <article class="card">
        <h2>Current Task + Queue Summary</h2>

        <div class="queue-summary" id="queueSummary"></div>

        <div class="current-task" id="currentTask"></div>

        <h2 style="margin-top: 12px;">Task Queue (clickable)</h2>
        <div class="task-queue" id="taskQueue"></div>

        <h2 style="margin-top: 12px;">Completed Tasks</h2>
        <div class="task-queue" id="completedTasks"></div>

        <h2 style="margin-top: 12px;">Status Feed</h2>
        <div class="feed" id="statusFeed"></div>
      </article>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
